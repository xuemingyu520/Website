<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于我们 - 云孪信息科技</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
.about-intro { max-width: 900px; margin: 0 auto 80px; }
.about-intro p { color: var(--text-secondary); line-height: 1.9; margin-bottom: 16px; font-size: 1.05rem; }
.timeline { position: relative; max-width: 800px; margin: 0 auto 80px; padding-left: 40px; }
.timeline::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--accent), rgba(0,229,255,0.1)); }
.timeline-item { position: relative; margin-bottom: 40px; padding-left: 30px; }
.timeline-item::before { content: ''; position: absolute; left: -33px; top: 6px; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 12px rgba(0,229,255,0.5); }
.timeline-item .year { font-size: 0.85rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.timeline-item h3 { font-size: 1.15rem; margin-bottom: 6px; }
.timeline-item p { font-size: 0.95rem; color: var(--text-secondary); }
.team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 900px; margin: 0 auto 80px; }
.team-card { text-align: center; padding: 30px 20px; }
.team-card .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #1a5fdc, #00e5ff); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: #fff; }
.team-card h4 { font-size: 1.05rem; margin-bottom: 4px; }
.team-card .role { font-size: 0.85rem; color: var(--text-secondary); }
.cert-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 0 auto 80px; }
.cert-card { text-align: center; padding: 28px 16px; }
.cert-card .cert-icon { width: 56px; height: 56px; background: rgba(0,229,255,0.08); border-radius: 12px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.cert-card h4 { font-size: 0.95rem; }
@media (max-width: 768px) { .team-grid { grid-template-columns: repeat(2, 1fr); } .cert-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .team-grid { grid-template-columns: 1fr; } .cert-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="preloader"><div class="preloader-spinner"></div></div>
<nav class="navbar"><div class="container"><a href="index.html" class="navbar-brand"><span class="logo-icon">DW</span><span>云孪信息科技</span></a><div class="navbar-links" id="navbar-links"></div><button class="hamburger" aria-label="菜单"><span></span><span></span><span></span></button></div></nav>
<section class="page-hero"><h1>关于我们</h1><p>让数字世界与物理世界深度融合，以数字孪生驱动产业未来</p></section>
<div class="container"><div class="about-intro fade-in" id="about-intro"></div><div class="section-header fade-in"><h2 class="section-title">发展历程</h2><p class="section-subtitle">从初创到行业领军，每一步都坚实有力</p></div><div class="timeline" id="timeline"></div><div class="section-header fade-in"><h2 class="section-title">核心团队</h2><p class="section-subtitle">汇聚行业顶尖人才，打造卓越产品</p></div><div class="team-grid" id="team-grid"></div><div class="section-header fade-in"><h2 class="section-title">资质证书</h2><p class="section-subtitle">权威认证，值得信赖</p></div><div class="cert-grid" id="cert-grid"></div></div>
<footer class="footer" id="dynamic-footer"></footer>
<script src="site-content/site-data.js"></script><script src="assets/js/data.js"></script><script src="assets/js/main.js"></script>
<script>(function(){var nav=DataLayer.getData('navigation').filter(function(n){return n.visible;});document.getElementById('navbar-links').innerHTML=nav.map(function(n){return '<a href="'+n.href+'">'+n.label+'</a>';}).join('');var about=DataLayer.getData('about');document.getElementById('about-intro').innerHTML=about.companyIntro;document.getElementById('timeline').innerHTML=about.milestones.map(function(m){return '<div class="timeline-item"><div class="year">'+m.year+'</div><h3>'+m.title+'</h3><p>'+m.desc+'</p></div>';}).join('');document.getElementById('team-grid').innerHTML=about.team.map(function(t){var initials=t.name.replace(/[^\u4e00-\u9fa5]/g,'').slice(-2);return '<div class="card-glass team-card"><div class="avatar">'+initials+'</div><h4>'+t.name+'</h4><p class="role">'+t.role+'</p></div>';}).join('');document.getElementById('cert-grid').innerHTML=about.certifications.map(function(c){return '<div class="card-glass cert-card"><div class="cert-icon">🏅</div><h4>'+c.name+'</h4></div>';}).join('');})();</script>
</body>
</html>
