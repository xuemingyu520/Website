<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台登录 - 云孪信息科技</title>
<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="login-page">

<div class="login-box">
  <div class="logo">
    <div class="logo-icon">DW</div>
    <h2>云孪信息科技</h2>
    <p class="login-subtitle">后台管理系统</p>
  </div>
  <form id="login-form">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary">登录</button>
    <p class="login-error" id="login-error"></p>
  </form>
</div>

<script src="../site-content/site-data.js"></script>
<script src="../assets/js/data.js"></script>
<script src="admin.js"></script>
</body>
</html>
